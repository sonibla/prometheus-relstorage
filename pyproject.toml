[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-relstorage"
version = "0.1.0"
description = "Prometheus collector for RelStorage metrics"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alban" }]
keywords = ["prometheus", "relstorage", "zodb", "monitoring", "metrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
]
dependencies = ["RelStorage>=3.0", "prometheus_client>=0.9"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]
